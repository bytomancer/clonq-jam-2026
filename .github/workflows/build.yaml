name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Game
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz

          unzip Godot_v4.6.3-stable_export_templates.tpz

          mkdir -p /home/runner/.local/share/godot/export_templates/4.6.3.stable

          mv -vn templates/* /home/runner/.local/share/godot/export_templates/4.6.3.stable

          cd godot

          nix develop .. --command \
            godot \
              --headless \
              --export-release "Web Release"

      - name: Create archive
        run: |
          zip -r bytomancer-${{ steps.tag_version.outputs.new_tag }}.zip output/

      - name: Create GitHub release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          artifacts: bytomancer-${{ steps.tag_version.outputs.new_tag }}.zip
